name: Update M3U8 Playlist
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgbm-dev \
            wget \
            unzip \
            xvfb \
            libnss3 \
            libatk-bridge2.0-0 \
            libasound2t64 \
            libcups2 \
            libdrm2 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libatk1.0-0t64 \
            libgtk-3-0t64

      - name: Install Python dependencies
        run: |
          pip install nodriver beautifulsoup4 yt-dlp[curl-cffi]

      - name: Run Scraper
        run: xvfb-run python chat.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat.m3u8
          git commit -m "Refresh Playlist" || echo "No changes"
          git push
