name: Update M3U8 Playlist
on:
  workflow_dispatch: # Allows manual run
  schedule:
    - cron: '0 * * * *' # Runs every hour

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deno (Required for Cloudflare Bypassing)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Run Scraper
        run: python chat.py "your_target_username"

      - name: Commit and Push chat.m3u8
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          git add chat.m3u8
          git commit -m "Update chat.m3u8 playlist" || echo "No changes to commit"
          git push
