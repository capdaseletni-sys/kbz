name: Update M3U8 Playlist
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

# THIS SECTION IS CRITICAL
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the default token which now has write access
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install yt-dlp and networking dependencies
        run: pip install "yt-dlp[default,curl-cffi]"

      - name: Run Scraper
        # Replace 'your_target_username' with the actual model name
        run: python chat.py "your_target_username"

      - name: Commit and Push chat.m3u8
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat.m3u8
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update chat.m3u8 playlist"
            git push origin main
          fi
