name: Update M3U8 Playlist
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install Latest Nightly yt-dlp
        run: |
          pip install -U --pre "yt-dlp[default,curl-cffi]"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
          pip install -U --pre "yt-dlp[default,curl-cffi]"

      - name: Run Scraper
        run: python chat.py "your_target_username"
        # Optional: environment variable for proxy
        # env:
        #   PROXY_URL: ${{ secrets.PROXY_URL }}

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat.m3u8
          git commit -m "Refresh Playlist" || echo "No changes"
          git push
