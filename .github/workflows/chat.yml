name: Chaturbate M3U8 Scraper
on:
  workflow_dispatch:  # Allows manual start
  schedule:
    - cron: '0 * * * *' # Runs every hour

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libasound2t64 \
            libcups2 libdrm2 libxcomposite1 libxdamage1 libxrandr2 \
            libatk1.0-0t64 libgtk-3-0t64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install nodriver beautifulsoup4 "yt-dlp[default,curl-cffi]" websockets==13.1

      - name: Run Scraper
        # xvfb-run provides a virtual display for the headless browser
        run: xvfb-run --auto-servernum python chat.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add chat.m3u8
          git commit -m "Update playlist: $(date)" || echo "No changes"
          git push
